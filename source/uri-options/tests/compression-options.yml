tests:
    -
        description: "Valid compression options are parsed correctly"
        uri: "mongodb://example.com/?compressors=zlib&zlibCompressionLevel=9"
        valid: true
        warning: false
        hosts: ~
        auth: ~
        options:
            compressors:
              - "zlib"
            zlibCompressionLevel: 9
    -
        description: "Multiple compressors are parsed correctly"
        uri: "mongodb://example.com/?compressors=snappy,zlib"
        valid: true
        warning: false
        hosts: ~
        auth: ~
        options:
            compressors:
              - "snappy"
              - "zlib"
    -
        description: "Non-numeric zlibCompressionLevel causes a warning"
        uri: "mongodb://example.com/?compressors=zlib&zlibCompressionLevel=invalid"
        valid: true
        warning: true
        hosts: ~
        auth: ~
        options: ~
    -
        description: "Too low zlibCompressionLevel causes a warning"
        uri: "mongodb://example.com/?compressors=zlib&zlibCompressionLevel=-2"
        valid: true
        warning: true
        hosts: ~
        auth: ~
        options: ~
    -
        description: "Too high zlibCompressionLevel causes a warning"
        uri: "mongodb://example.com/?compressors=zlib&zlibCompressionLevel=10"
        valid: true
        warning: true
        hosts: ~
        auth: ~
        options: ~
    -
        description: "Valid zstdCompressionLevel is parsed correctly"
        uri: "mongodb://example.com/?compressors=zstd&zstdCompressionLevel=22"
        valid: true
        warning: false
        hosts: ~
        auth: ~
        options:
            compressors:
              - "zstd"
            zstdCompressionLevel: 22
    -
        description: "Non-numeric zstdCompressionLevel causes a warning"
        uri: "mongodb://example.com/?compressors=zstd&zstdCompressionLevel=invalid"
        valid: true
        warning: true
        hosts: ~
        auth: ~
        options: ~
    -
        description: "Too low zstdCompressionLevel causes a warning"
        uri: "mongodb://example.com/?compressors=zstd&zstdCompressionLevel=0"
        valid: true
        warning: true
        hosts: ~
        auth: ~
        options: ~
    -
        description: "Too high zstdCompressionLevel causes a warning"
        uri: "mongodb://example.com/?compressors=zstd&zstdCompressionLevel=23"
        valid: true
        warning: true
        hosts: ~
        auth: ~
        options: ~
