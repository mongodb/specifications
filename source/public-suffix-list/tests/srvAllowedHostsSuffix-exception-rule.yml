# "!www.ck" is an exception rule in the Public Suffix List. It prevails over the
# wildcard rule "*.ck" and has its leftmost label removed, so the public suffix of
# "www.ck" is "ck" -- "www.ck" is not itself a public suffix and must be accepted.
#
# "hosts" is omitted and "ping" is false because this test only asserts that the
# connection string is accepted, which is independent of the topology under test.
uri: "mongodb+srv://test1.test.build.10gen.cc/?srvAllowedHostsSuffix=www.ck"
seeds:
    - localhost.test.build.10gen.cc:27017
    - localhost.test.build.10gen.cc:27018
options:
    srvAllowedHostsSuffix: www.ck
    ssl: true
error: false
ping: false
