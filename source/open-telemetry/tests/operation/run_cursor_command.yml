description: operation run_cursor_command
schemaVersion: '1.27'
createEntities:
  - client:
      id: &client0 client0
      useMultipleMongoses: false
      observeTracingMessages:
        enableCommandPayload: true
  - database:
      id: &database0 database0
      client: *client0
      databaseName: &database0Name operation-run-cursor-command
  - collection:
      id: &collection0 collection0
      database: *database0
      collectionName: &collection0Name test

initialData:
  - collectionName: *collection0Name
    databaseName: *database0Name
    documents:
      - { _id: 1 }

tests:
  - description: cursor-returning runCommand on a database-level command
    operations:
      # The test runner fully drains the returned cursor, so the command is executed and no
      # server-side cursor remains.
      - name: runCursorCommand
        object: *database0
        arguments:
          command: { listCollections: 1, nameOnly: true }
          commandName: listCollections
        expectResult:
          - name: test

    expectTracingMessages:
      - client: *client0
        ignoreExtraSpans: false
        spans:
          # listCollections does not target a specific collection, so the span name carries only
          # the database name and db.collection.name is omitted.
          - name: runCommand operation-run-cursor-command
            attributes:
              db.system.name: mongodb
              db.namespace: *database0Name
              db.collection.name: { $$exists: false }
              db.operation.name: runCommand
              db.operation.summary: runCommand operation-run-cursor-command
            nested:
              - name: listCollections
                attributes:
                  db.system.name: mongodb
                  db.namespace: *database0Name
                  db.collection.name: { $$exists: false }
                  db.command.name: listCollections
                  network.transport: tcp
                  db.mongodb.cursor_id: { $$exists: false }
                  db.response.status_code: { $$exists: false }
                  exception.message: { $$exists: false }
                  exception.type: { $$exists: false }
                  exception.stacktrace: { $$exists: false }
                  server.address: { $$type: string }
                  server.port: { $$type: [ int, long ] }
                  db.query.summary: listCollections operation-run-cursor-command
                  db.query.text:
                    $$matchAsDocument:
                      $$matchAsRoot:
                        listCollections: 1
                  db.mongodb.server_connection_id:
                    $$type: [ int, long ]
                  db.mongodb.driver_connection_id:
                    $$type: [ int, long ]

  - description: cursor-returning runCommand on a collection-targeting command
    operations:
      - name: runCursorCommand
        object: *database0
        arguments:
          command: { find: test, filter: {} }
          commandName: find
        expectResult:
          - { _id: 1 }

    expectTracingMessages:
      - client: *client0
        ignoreExtraSpans: false
        spans:
          # Unlike the document-returning helper, a cursor-returning command usually targets a
          # collection: the span name and db.collection.name reflect the targeted collection.
          - name: runCommand operation-run-cursor-command.test
            attributes:
              db.system.name: mongodb
              db.namespace: *database0Name
              db.collection.name: *collection0Name
              db.operation.name: runCommand
              db.operation.summary: runCommand operation-run-cursor-command.test
            nested:
              - name: find
                attributes:
                  db.system.name: mongodb
                  db.namespace: *database0Name
                  db.collection.name: *collection0Name
                  db.command.name: find
                  network.transport: tcp
                  # The collection holds a single document, so the find returns it in the first
                  # batch and no server-side cursor remains.
                  db.mongodb.cursor_id: { $$exists: false }
                  db.response.status_code: { $$exists: false }
                  exception.message: { $$exists: false }
                  exception.type: { $$exists: false }
                  exception.stacktrace: { $$exists: false }
                  server.address: { $$type: string }
                  server.port: { $$type: [ int, long ] }
                  db.query.summary: find operation-run-cursor-command.test
                  db.query.text:
                    $$matchAsDocument:
                      $$matchAsRoot:
                        find: test
                  db.mongodb.server_connection_id:
                    $$type: [ int, long ]
                  db.mongodb.driver_connection_id:
                    $$type: [ int, long ]
