description: operation collection_bulk_write
schemaVersion: '1.27'
createEntities:
  - client:
      id: &client0 client0
      useMultipleMongoses: false
      observeTracingMessages:
        enableCommandPayload: true
  - database:
      id: &database0 database0
      client: *client0
      databaseName: &database0Name operation-collection-bulk-write
  - collection:
      id: &collection0 collection0
      database: *database0
      collectionName: &collection0Name test

initialData:
  - collectionName: *collection0Name
    databaseName: *database0Name
    documents: []

tests:
  - description: mixed write models report bulkWrite
    operations:
      - name: bulkWrite
        object: *collection0
        arguments:
          requests:
            - insertOne:
                document: { _id: 1, x: 1 }
            - updateOne:
                filter: { _id: 2 }
                update: { $set: { x: 2 } }
            - deleteOne:
                filter: { _id: 3 }

    expectTracingMessages:
      - client: *client0
        ignoreExtraSpans: false
        spans:
          # One operation span for the public API call, named after the derived operation name.
          - name: bulkWrite operation-collection-bulk-write.test
            attributes:
              db.system.name: mongodb
              db.namespace: *database0Name
              db.collection.name: *collection0Name
              db.operation.name: bulkWrite
              db.operation.summary: bulkWrite operation-collection-bulk-write.test
            nested:
              # A mixed collection bulkWrite sends one command per write type, in order.
              - name: insert
                attributes:
                  db.system.name: mongodb
                  db.namespace: *database0Name
                  db.collection.name: *collection0Name
                  db.command.name: insert
                  network.transport: tcp
                  db.mongodb.cursor_id: { $$exists: false }
                  db.response.status_code: { $$exists: false }
                  exception.message: { $$exists: false }
                  exception.type: { $$exists: false }
                  exception.stacktrace: { $$exists: false }
                  server.address: { $$type: string }
